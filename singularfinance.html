<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Singular Finance — Hands-On Advice In Your Boardroom</title>
  <meta name="description" content="Singular Finance — Hands-On Advice In Your Boardroom" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:        #090909;
      --bg-card:   #111111;
      --accent:    #00E5CC;
      --white:     #FFFFFF;
      --muted:     #666666;
      --border:    rgba(255,255,255,0.08);
      --font:      'Space Grotesk', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--font);
      font-weight: 300;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 60px;
      background: linear-gradient(to bottom, rgba(9,9,9,0.95) 0%, transparent 100%);
    }

    .nav-logo {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--white);
      text-decoration: none;
    }

    .nav-logo span { color: var(--accent); }

    /* ── HERO ───────────────────────────────── */
    #hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 60px;
      overflow: hidden;
    }

    /* animated data-wave canvas */
    #wave-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.55;
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 820px;
    }

    .hero-headline {
      font-size: clamp(42px, 6vw, 82px);
      font-weight: 700;
      line-height: 1.0;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .hero-headline em {
      font-style: normal;
      color: var(--accent);
    }

    .hero-quote {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      max-width: 520px;
    }

    .hero-quote-bar {
      flex-shrink: 0;
      width: 2px;
      height: 48px;
      background: var(--accent);
      margin-top: 4px;
    }

    .hero-quote p {
      font-size: 15px;
      font-weight: 300;
      font-style: italic;
      color: rgba(255,255,255,0.55);
      line-height: 1.55;
    }

    .hero-quote cite {
      display: block;
      font-size: 11px;
      font-style: normal;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 8px;
    }

    .hero-scroll-line {
      position: absolute;
      bottom: 40px;
      left: 60px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      z-index: 2;
    }

    .hero-scroll-line::before {
      content: '';
      display: block;
      width: 40px;
      height: 1px;
      background: var(--muted);
    }

    /* ── RESPONSIVE ─────────────────────────── */
    @media (max-width: 900px) {
      nav { padding: 24px 32px; }

      #hero { padding-left: 32px; padding-right: 32px; }

      .hero-scroll-line { left: 32px; }
    }

    @media (max-width: 600px) {
      nav { padding: 20px 24px; }

      #hero { padding: 120px 24px 80px; }
      .hero-scroll-line { left: 24px; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="nav-logo">Singular<span>.</span>Finance</div>
  </nav>

  <!-- HERO -->
  <section id="hero">
    <canvas id="wave-canvas" aria-hidden="true"></canvas>

    <div class="hero-content">
      <h1 class="hero-headline">
        Hands-On Advice<br>In Your <em>Boardroom</em>
      </h1>

      <div class="hero-quote">
        <div class="hero-quote-bar"></div>
        <div>
          <p>“Today's ‘best practices’ lead to dead ends; the best paths are new and untried.”</p>
          <cite>— Peter Thiel</cite>
        </div>
      </div>
    </div>

    <div class="hero-scroll-line">Scroll</div>
  </section>

  <script>
    const canvas = document.getElementById('wave-canvas');
    const ctx = canvas.getContext('2d');

    let W, H, points = [], frame = 0;

    function resize() {
      W = canvas.width  = canvas.offsetWidth;
      H = canvas.height = canvas.offsetHeight;
      init();
    }

    function init() {
      points = [];
      const cols = Math.ceil(W / 18) + 2;
      const rows = 9;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          points.push({
            bx: c * 18,
            by: H * 0.28 + r * (H * 0.62 / (rows - 1)),
            phase: (c * 0.22) + (r * 0.55),
            amp:   18 + r * 6,
            speed: 0.012 + r * 0.003,
          });
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      const cols = Math.ceil(W / 18) + 2;
      const rows = points.length / cols;

      for (let r = 0; r < rows - 1; r++) {
        const alpha = 0.06 + r * 0.025;
        ctx.beginPath();
        ctx.strokeStyle = `rgba(0,229,204,${alpha})`;
        ctx.lineWidth = 1;

        for (let c = 0; c < cols; c++) {
          const p = points[r * cols + c];
          const y = p.by + Math.sin(frame * p.speed + p.phase) * p.amp;
          c === 0 ? ctx.moveTo(p.bx, y) : ctx.lineTo(p.bx, y);
        }
        ctx.stroke();
      }

      frame++;
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    draw();
  </script>
</body>
</html>
