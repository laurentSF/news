<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Singular Finance</title>
  <meta name="description" content="Singular Finance" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:     #090909;
      --accent: #00E5CC;
      --white:  #FFFFFF;
      --font:   'Space Grotesk', sans-serif;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--font);
      font-weight: 300;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #wave-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.55;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 48px 24px;
    }

    h1 {
      font-size: clamp(22px, 4.2vw, 36px);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      line-height: 1.15;
    }

    h1 span {
      color: var(--accent);
    }

    .name {
      margin-top: 22px;
      font-size: 15px;
      font-weight: 300;
      letter-spacing: 0.14em;
      color: rgba(255, 255, 255, 0.55);
    }
  </style>
</head>
<body>
  <canvas id="wave-canvas" aria-hidden="true"></canvas>

  <main>
    <h1>Singular<span>.</span>Finance</h1>
    <p class="name">Laurent Le Moal</p>
  </main>

  <script>
    const canvas = document.getElementById('wave-canvas');
    const ctx = canvas.getContext('2d');

    let W, H, points = [], frame = 0;

    function resize() {
      W = canvas.width = canvas.offsetWidth;
      H = canvas.height = canvas.offsetHeight;
      init();
    }

    function init() {
      points = [];
      const cols = Math.ceil(W / 18) + 2;
      const rows = 9;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          points.push({
            bx: c * 18,
            by: H * 0.28 + r * (H * 0.62 / (rows - 1)),
            phase: (c * 0.22) + (r * 0.55),
            amp: 18 + r * 6,
            speed: 0.012 + r * 0.003,
          });
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      const cols = Math.ceil(W / 18) + 2;
      const rows = points.length / cols;

      for (let r = 0; r < rows - 1; r++) {
        const alpha = 0.06 + r * 0.025;
        ctx.beginPath();
        ctx.strokeStyle = `rgba(0,229,204,${alpha})`;
        ctx.lineWidth = 1;

        for (let c = 0; c < cols; c++) {
          const p = points[r * cols + c];
          const y = p.by + Math.sin(frame * p.speed + p.phase) * p.amp;
          c === 0 ? ctx.moveTo(p.bx, y) : ctx.lineTo(p.bx, y);
        }
        ctx.stroke();
      }

      frame++;
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    draw();
  </script>
</body>
</html>
